server {
    listen 80;
    root /usr/share/nginx/html;

    location = /liff {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files /liff/index.html =404;
    }

    location = /liff/ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files /liff/index.html =404;
    }

    location = /liff/index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /liff {
        try_files $uri $uri/ /liff/index.html;
    }

    location / {
        return 404;
    }
}
